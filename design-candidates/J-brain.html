<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brian Mathew — the systems I run</title>
<meta name="description" content="Developer in New Jersey. 25 agents running unattended. Open a system and break it — live demos of everything I've built.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CANDIDATE J — "BRAIN"
   Brian: "the visual just doesn't wow me... then incorporate my
   projects and information that's easy to read."

   So two jobs, separated cleanly:
   1. WOW — a real 3D particle structure. ~900 particles in true
      3D (rotation matrices + perspective projection), organised
      into lobes around four system cores, with signal pulses
      that physically travel along axons between them. Depth is
      carried by size, alpha and blur, so it reads volumetric
      rather than flat. It rotates on its own and tilts to the
      cursor.
   2. READABLE — the projects are NOT hidden in the visual. They
      live in a permanent, high-contrast docked panel on the
      right. Nothing important requires hunting.
   Click either the core or the panel row to open a live demo.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#03060d;--panel:#0a1220;--panel2:#101a2c;--edge:#1d2c44;
  --ink:#eaf1f8;--ink2:#9dafc2;--mute:#63768d;
  --cyan:#22e6c8;--mag:#ff4d8d;--amber:#ffc247;--violet:#9d8cff;--red:#ff5f56;
  --d:'Geist',system-ui,sans-serif;--m:'Geist Mono',ui-monospace,Consolas,monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--void);color:var(--ink);font-family:var(--d);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px}
#brain{position:fixed;inset:0;display:block}
/* a soft vignette so the structure sits in space rather than on a rectangle */
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 92% 88% at 40% 50%,transparent 58%,rgba(3,6,13,.62) 100%)}

/* ---------- identity ---------- */
.plate{position:fixed;top:32px;left:34px;z-index:10;max-width:400px}
.plate .who{font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:1.05}
.plate .what{color:var(--ink2);margin-top:9px;font-size:15.5px}
.plate .what b{color:var(--ink);font-weight:600}
.plate .live{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cyan);margin-top:14px;display:flex;align-items:center;gap:8px}
.plate .live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);display:block;
  box-shadow:0 0 10px var(--cyan);animation:bp 2.2s infinite}
@keyframes bp{50%{opacity:.28}}
.links{position:fixed;bottom:30px;left:34px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;
  font-family:var(--m);font-size:12.5px;max-width:400px}
.links a{padding:9px 14px;border-radius:8px;text-decoration:none;border:1px solid var(--edge);
  color:var(--ink2);background:rgba(10,18,32,.82);backdrop-filter:blur(8px);transition:.16s}
.links a:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px)}
.links a.p{background:var(--cyan);border-color:var(--cyan);color:#04120f;font-weight:600}

/* ---------- READABLE: docked project panel ---------- */
.dock{position:fixed;top:0;right:0;bottom:0;width:392px;z-index:10;padding:30px 26px;
  background:linear-gradient(270deg,rgba(6,11,20,.95),rgba(6,11,20,.72) 78%,transparent);
  overflow:auto;display:flex;flex-direction:column;gap:10px}
@media(max-width:900px){.dock{position:static;width:auto;height:auto;background:rgba(6,11,20,.95);
  max-height:52vh}html,body{overflow:auto}}
.dock h2{font-family:var(--m);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);margin-bottom:4px}
.sys{text-align:left;width:100%;cursor:pointer;border:1px solid var(--edge);border-radius:12px;
  padding:15px 16px;background:rgba(16,26,44,.72);transition:.18s;color:inherit;font:inherit;
  border-left:3px solid var(--c)}
.sys:hover,.sys:focus-visible{background:rgba(22,36,60,.92);transform:translateX(-4px);
  border-color:var(--c)}
.sys .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sys h3{font-size:17.5px;font-weight:800;letter-spacing:-.02em}
.sys .st{font-family:var(--m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;color:var(--c);border:1px solid var(--c);opacity:.85}
.sys p{font-size:13.5px;color:var(--ink2);margin-top:7px}
.sys .facts{display:flex;gap:14px;margin-top:11px;font-family:var(--m);flex-wrap:wrap}
.sys .facts div span{display:block;font-size:15px;color:var(--c);font-weight:500}
.sys .facts div small{font-size:9.5px;color:var(--mute)}
.sys .go{font-family:var(--m);font-size:10.5px;color:var(--c);margin-top:11px;
  letter-spacing:.1em;text-transform:uppercase}
.dockfoot{font-family:var(--m);font-size:10.5px;color:var(--mute);line-height:1.8;
  margin-top:auto;padding-top:14px;border-top:1px solid var(--edge)}

/* ---------- window ---------- */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(2,5,11,.7);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#win{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);
  width:min(880px,94vw);max-height:88vh;background:var(--panel);border:1px solid var(--edge);
  border-radius:15px;box-shadow:0 50px 140px rgba(0,0,0,.75);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s cubic-bezier(.2,.8,.3,1)}
#win.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.wbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--edge);
  font-family:var(--m);font-size:12px;color:var(--mute);flex:none}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;display:block}
.wclose{margin-left:auto;background:none;border:1px solid var(--edge);color:var(--ink2);
  font-family:var(--m);font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer}
.wclose:hover{border-color:var(--red);color:var(--red)}
.wbody{padding:22px;overflow:auto}
.wbody h2{font-size:23px;font-weight:800;letter-spacing:-.025em;margin-bottom:5px}
.wbody .lede{color:var(--ink2);margin-bottom:16px;max-width:66ch}
.wbody .lede b{color:var(--ink);font-weight:600}
.tag{font-family:var(--m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--c);margin-bottom:8px}
.stack{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.stack span{font-family:var(--m);font-size:11.5px;padding:3px 9px;border-radius:5px;
  background:var(--panel2);border:1px solid var(--edge);color:var(--ink2)}
.btn{font-family:var(--m);font-size:12.5px;padding:9px 15px;border-radius:8px;cursor:pointer;
  border:1px solid var(--c);background:transparent;color:var(--c);transition:.16s}
.btn:hover{background:var(--c);color:#03060d}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}
.demo{border:1px solid var(--edge);border-radius:10px;background:var(--void);overflow:hidden}
.demo-h{padding:9px 13px;border-bottom:1px solid var(--edge);font-family:var(--m);font-size:11px;
  color:var(--mute);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.demo-h b{color:var(--ink);font-weight:500}
.log{font-family:var(--m);font-size:11.5px;line-height:1.85;padding:12px 13px;height:180px;
  overflow:auto;white-space:pre-wrap}
.log .t{color:var(--mute)}.log .ok{color:var(--cyan)}.log .warn{color:var(--amber)}
.log .err{color:var(--red)}.log .dim{color:var(--ink2)}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding:12px}
.ag{font-family:var(--m);font-size:10.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--edge);
  color:var(--ink2);display:flex;align-items:center;gap:6px}
.ag i{width:5px;height:5px;border-radius:50%;background:var(--cyan);flex:none;box-shadow:0 0 6px var(--cyan)}
.ag.down{border-color:var(--red);color:var(--red)}
.ag.down i{background:var(--red);box-shadow:0 0 6px var(--red)}
.ag.fire i{background:var(--amber);box-shadow:0 0 9px var(--amber)}
.clients{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media(max-width:620px){.clients{grid-template-columns:1fr}}
.client{border:1px solid var(--edge);border-radius:9px;padding:12px;background:var(--panel2)}
.client .cn{font-family:var(--m);font-size:11px;color:var(--mute);margin-bottom:9px;display:flex;justify-content:space-between}
.client .cn b{color:var(--mag)}
.bar{height:6px;border-radius:4px;background:var(--edge);position:relative;cursor:pointer}
.bar i{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:var(--mag)}
.bar b{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--mag);
  transform:translateX(-7px);box-shadow:0 0 12px var(--mag)}
.client.off{opacity:.42}.client .st{font-family:var(--m);font-size:10px;color:var(--mute);margin-top:9px}
.sq{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:230px;padding:12px}
.sq i{aspect-ratio:1;border-radius:2px;background:var(--panel2);border:1px solid var(--edge);
  transition:.22s;font-style:normal}
.sq i.f{background:var(--amber);border-color:var(--amber)}
.sq i.w{background:var(--violet);border-color:var(--violet);transform:scale(1.35);box-shadow:0 0 16px var(--violet)}
.sqwrap{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
@media(max-width:620px){.sqwrap{grid-template-columns:1fr}}
.nums{display:flex;gap:18px;font-family:var(--m);flex-wrap:wrap;margin-top:16px}
.nums div span{display:block;font-size:19px;color:var(--c)}
.nums div small{font-size:10px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>

<canvas id="brain"></canvas>
<div id="vig"></div>

<div class="plate">
  <div class="who">Brian Mathew</div>
  <div class="what">Developer in New Jersey. <b>25 agents I wrote are running unattended right
    now.</b> Every system here has a demo you can operate — and break.</div>
  <div class="live"><i></i>fleet online · 81 tests green · $0 per run</div>
</div>

<div class="links">
  <a class="p" href="mailto:mathew.brian@gmail.com">Email me</a>
  <a href="resume.pdf">Résumé</a>
  <a href="https://github.com/bmath8">GitHub</a>
  <a href="https://linkedin.com/in/brian-mathew-66235556">LinkedIn</a>
</div>

<!-- READABLE: nothing important is hidden in the visual -->
<div class="dock" id="dock">
  <h2>Systems — click to open a live demo</h2>
</div>

<div id="scrim"></div>
<div id="win" role="dialog" aria-modal="true" aria-label="Live demo">
  <div class="wbar">
    <span class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></span>
    <span id="wtitle">—</span>
    <button class="wclose" id="wclose">close ✕</button>
  </div>
  <div class="wbody" id="wbody"></div>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
var SYSTEMS=[
 {id:'fleet',name:'Brian OS',st:'running now',c:'#22e6c8',
  blurb:'25 scheduled agents on a local LLM. Self-healing watchdog, structured state, draft-only guardrails.',
  facts:[['25','cron jobs'],['81','tests green'],['24/25','last run ok']],
  cta:'kill the gateway →', pos:[-30,-90,0], lobe:640},
 {id:'boom',name:'BoomBox',st:'prototype',c:'#ff4d8d',
  blurb:'Real-time collaborative listening. Synced playback over a Node WebSocket layer with Redis Pub/Sub.',
  facts:[['~48k','lines TS'],['20','test files']],
  cta:'drop a socket →', pos:[430,120,-190], lobe:400},
 {id:'squares',name:'Super Bowl Squares',st:'ran a live game',c:'#ffc247',
  blurb:'Live score sync, chat, host controls, and a write-lock so nobody claims a square after kickoff.',
  facts:[['100','squares live'],['1','real event']],
  cta:'run the draw →', pos:[-470,180,150], lobe:330},
 {id:'day',name:'What I can do',st:'front-end craft',c:'#9d8cff',
  blurb:'Not a project — a demonstration. Colour interpolation, canvas, and scroll motion, no framework.',
  facts:[['0','frameworks'],['1','static file']],
  cta:'drag the day →', pos:[90,340,240], lobe:330}
];
var AGENTS=['daily-brief','system-watchdog','overnight-worker','learning-agent','career','currency',
 'gig-scanner','calendar','scout','inbox','finance','health','research','wiki','weekly-review',
 'ceo-report','outcome-learner','feedback','harmony-backup','skill-miner','memory-index',
 'model-review','fleet-health','dashboard','currency-weekly'];

/* ============================================================
   THE WOW — real 3D particle structure
   ============================================================ */
var cv=document.getElementById('brain'),cx=cv.getContext('2d');
var W,H,DPR,cxp,cyp,FOV=1150;
var P=[],CORES=[],AXONS=[],PULSES=[];
var rotY=0,rotX=0,targY=0,targX=0,t=0;
var hoverCore=null;

function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

function build(){
  P=[];CORES=[];AXONS=[];
  SYSTEMS.forEach(function(s,si){
    var col=hex(s.c);
    CORES.push({s:s,x:s.pos[0],y:s.pos[1],z:s.pos[2],col:col,ph:si*1.4});
    // a lobe of particles clustered around each core (gaussian-ish shell)
    var n = si===0 ? 900 : 420;
    for(var i=0;i<n;i++){
      var u=Math.random()*2-1, th=Math.random()*6.283, r=s.lobe*Math.pow(Math.random(),.55);
      var sp=Math.sqrt(1-u*u);
      P.push({
        bx:s.pos[0]+sp*Math.cos(th)*r, by:s.pos[1]+u*r*.72, bz:s.pos[2]+sp*Math.sin(th)*r,
        col:col, ph:Math.random()*6.283, sp:.4+Math.random()*.9, core:si,
        amp:14+Math.random()*34
      });
    }
  });
  // axons: fleet is the hub, plus a couple of cross links
  [[0,1],[0,2],[0,3],[1,3]].forEach(function(p){ AXONS.push({a:p[0],b:p[1]}); });
}

function size(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  // bias the structure left so it doesn't sit under the docked panel
  cxp = W>900 ? (W-392)*0.52 : W*0.5;
  cyp = H*0.52;
}

function project(x,y,z){
  // rotate Y then X, then perspective-divide
  var cy0=Math.cos(rotY),sy0=Math.sin(rotY);
  var x1=x*cy0 - z*sy0, z1=x*sy0 + z*cy0;
  var cx0=Math.cos(rotX),sx0=Math.sin(rotX);
  var y1=y*cx0 - z1*sx0, z2=y*sx0 + z1*cx0;
  var sc=FOV/(FOV+z2+780);
  return {x:cxp+x1*sc, y:cyp+y1*sc, s:sc, z:z2};
}

/* signal pulses travel along axons — this is what makes it read alive */
function firePulse(){
  var ax=AXONS[Math.floor(Math.random()*AXONS.length)];
  var fromFleet=Math.random()<.75;
  PULSES.push({a:fromFleet?ax.a:ax.b, b:fromFleet?ax.b:ax.a, p:0,
    sp:.011+Math.random()*.012, col:CORES[ax.b].col});
}
setInterval(firePulse,520);

function frame(){
  t+=.006;
  rotY += (targY-rotY)*.045 + .0016;   // always drifting, plus cursor easing
  rotX += (targX-rotX)*.045;
  cx.clearRect(0,0,W,H);

  // ---- axons (behind everything) ----
  cx.lineWidth=1.6;
  AXONS.forEach(function(ax){
    var A=CORES[ax.a],B=CORES[ax.b];
    var pa=project(A.x,A.y,A.z),pb=project(B.x,B.y,B.z);
    var g=cx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);
    g.addColorStop(0,'rgba('+A.col.join(',')+',.34)');
    g.addColorStop(1,'rgba('+B.col.join(',')+',.34)');
    cx.strokeStyle=g;cx.beginPath();cx.moveTo(pa.x,pa.y);cx.lineTo(pb.x,pb.y);cx.stroke();
  });

  // ---- particles, painted far-to-near so depth reads correctly ----
  var pts=[];
  P.forEach(function(p){
    var w=Math.sin(t*p.sp*2.4+p.ph);
    var pr=project(p.bx+w*p.amp, p.by+Math.cos(t*p.sp*2+p.ph)*p.amp*.6, p.bz+w*p.amp*.5);
    pts.push({pr:pr,col:p.col,tw:.45+.55*Math.sin(t*2.2+p.ph)});
  });
  pts.sort(function(a,b){return b.pr.z-a.pr.z;});
  pts.forEach(function(o){
    var s=o.pr.s, r=Math.max(.7, s*3.4);
    // far particles are dimmer and smaller = depth without a blur filter
    var a=Math.min(1,(s-.30)*2.6)*o.tw*1.25;
    if(a<=.015)return;
    cx.fillStyle='rgba('+o.col.join(',')+','+a.toFixed(3)+')';
    cx.beginPath();cx.arc(o.pr.x,o.pr.y,r,0,6.283);cx.fill();
  });

  // ---- travelling pulses ----
  for(var i=PULSES.length-1;i>=0;i--){
    var pu=PULSES[i];pu.p+=pu.sp;
    if(pu.p>=1){PULSES.splice(i,1);continue;}
    var A=CORES[pu.a],B=CORES[pu.b];
    var e=pu.p<.5?2*pu.p*pu.p:1-Math.pow(-2*pu.p+2,2)/2;
    var pr=project(A.x+(B.x-A.x)*e, A.y+(B.y-A.y)*e, A.z+(B.z-A.z)*e);
    var rad=3.2*pr.s;
    var g=cx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,rad*7);
    g.addColorStop(0,'rgba('+pu.col.join(',')+',.95)');
    g.addColorStop(1,'rgba('+pu.col.join(',')+',0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(pr.x,pr.y,rad*7,0,6.283);cx.fill();
    cx.fillStyle='rgba(255,255,255,.9)';
    cx.beginPath();cx.arc(pr.x,pr.y,rad*.75,0,6.283);cx.fill();
  }

  // ---- cores + labels ----
  hoverCore=null;
  CORES.slice().sort(function(a,b){
    return project(b.x,b.y,b.z).z-project(a.x,a.y,a.z).z;
  }).forEach(function(c){
    var pr=project(c.x,c.y,c.z);
    var pl=.5+.5*Math.sin(t*1.9+c.ph);
    var R=(c.s.id==='fleet'?26:18)*pr.s*(1+pl*.10);
    var g=cx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,R*8);
    g.addColorStop(0,'rgba('+c.col.join(',')+',.85)');
    g.addColorStop(.4,'rgba('+c.col.join(',')+',.18)');
    g.addColorStop(1,'rgba('+c.col.join(',')+',0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(pr.x,pr.y,R*8,0,6.283);cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(pr.x,pr.y,R*.62,0,6.283);cx.fill();
    cx.strokeStyle='rgba('+c.col.join(',')+',.55)';cx.lineWidth=1.2;
    cx.beginPath();cx.arc(pr.x,pr.y,R+8+pl*9,0,6.283);cx.stroke();
    // label
    cx.fillStyle='rgba(234,241,248,.95)';
    cx.font='800 '+(14*Math.max(.8,pr.s)).toFixed(1)+'px Geist,system-ui,sans-serif';
    cx.fillText(c.s.name, pr.x+R+14, pr.y+4);
    c._sx=pr.x;c._sy=pr.y;c._sr=Math.max(16,R+14);
  });
  requestAnimationFrame(frame);
}

addEventListener('resize',function(){size();});
addEventListener('mousemove',function(e){
  targY=((e.clientX/innerWidth)-.5)*1.15;
  targX=((e.clientY/innerHeight)-.5)*-0.55;
  var hit=CORES.filter(function(c){return Math.hypot(e.clientX-c._sx,e.clientY-c._sy)<c._sr;})[0];
  cv.style.cursor=hit?'pointer':'default';
});
cv.addEventListener('click',function(e){
  var hit=CORES.filter(function(c){return Math.hypot(e.clientX-c._sx,e.clientY-c._sy)<c._sr;})[0];
  if(hit)open(hit.s.id);
});
build();size();frame();

/* ============================================================
   READABLE DOCK
   ============================================================ */
var dock=document.getElementById('dock');
SYSTEMS.forEach(function(s){
  var b=document.createElement('button');
  b.className='sys';b.style.setProperty('--c',s.c);
  b.innerHTML='<div class="top"><h3>'+s.name+'</h3><span class="st">'+s.st+'</span></div>'+
    '<p>'+s.blurb+'</p><div class="facts">'+
    s.facts.map(function(f){return '<div><span>'+f[0]+'</span><small>'+f[1]+'</small></div>';}).join('')+

DEMOS.fleet=function(){return '<div style="--c:#22e6c8">'+
 '<div class="tag">running now · your machine can\'t hurt mine</div>'+
 '<h2>Brian OS — 25 agents, self-healing</h2>'+
 '<p class="lede"><b>The agents aren\'t the interesting part — the operations are.</b> A watchdog '+
 'polls the gateway. If it dies, the watchdog notices, confirms it wasn\'t one bad poll, and '+
 'restarts it without me. <b>Kill it and watch.</b></p>'+
 '<div class="demo"><div class="demo-h"><span><b>gateway</b> + 25 scheduled agents</span>'+
 '<span id="fstat">● healthy</span></div><div class="agents" id="fagents"></div>'+
 '<div class="log" id="flog"></div></div>'+
 '<div class="row"><button class="btn danger" id="fkill">Kill the gateway</button>'+
 '<button class="btn" id="frun" style="--c:#22e6c8">Fire an agent now</button>'+
 '<span style="font-family:var(--m);font-size:11px;color:var(--mute)">watchdog runs every 4h in reality — sped up here</span></div>'+
 '<div class="nums"><div><span>25</span><small>cron jobs</small></div>'+
 '<div><span>81</span><small>tests green</small></div><div><span>24/25</span><small>last run ok</small></div>'+
 '<div><span>$0</span><small>per run · local model</small></div></div>'+
 '<div class="stack"><span>Python</span><span>Ollama</span><span>PowerShell</span>'+

INIT.fleet=function(){
  var grid=document.getElementById('fagents'),log=document.getElementById('flog'),
      stat=document.getElementById('fstat'),kill=document.getElementById('fkill'),run=document.getElementById('frun');
  AGENTS.forEach(function(a){var d=document.createElement('div');d.className='ag';
    d.innerHTML='<i></i>'+a;d.dataset.n=a;grid.appendChild(d);});
  logline(log,'ok','gateway up · pid 8814 · 25 jobs registered');
  logline(log,'dim','watchdog armed — polling every 4s (real interval: 4h)');
  var alive=true;
  function fire(manual){
    var a=AGENTS[Math.floor(Math.random()*AGENTS.length)];
    var el=grid.querySelector('[data-n="'+a+'"]');
    if(el){el.classList.add('fire');setTimeout(function(){el.classList.remove('fire');},900);}
    logline(log,'ok',a+' → ok'+(manual?' (manual)':''));
  }
  timers.push(setInterval(function(){if(alive)fire(false);},2600));
  run.onclick=function(){alive?fire(true):logline(log,'err','cannot run — gateway is down');};
  kill.onclick=function(){
    if(!alive)return;alive=false;kill.disabled=true;
    stat.textContent='● DOWN';stat.style.color='var(--red)';
    grid.querySelectorAll('.ag').forEach(function(e){e.classList.add('down');});
    logline(log,'err','gateway process terminated by user (SIGKILL)');
    logline(log,'err','25 scheduled jobs now orphaned — nothing will run');
    timers.push(setTimeout(function(){logline(log,'warn','watchdog: poll failed — no response');},1400));
    timers.push(setTimeout(function(){logline(log,'warn','watchdog: confirming (avoiding a false positive on one bad poll)');},2900));
    timers.push(setTimeout(function(){logline(log,'warn','watchdog: confirmed dead → restarting');},4300));
    timers.push(setTimeout(function(){
      alive=true;kill.disabled=false;stat.textContent='● healthy';stat.style.color='';
      grid.querySelectorAll('.ag').forEach(function(e){e.classList.remove('down');});
      logline(log,'ok','gateway up · pid '+(9000+Math.floor(Math.random()*900))+' · 25 jobs re-registered');
      logline(log,'dim','recovered with no input from me. that is the whole point.');
    },5900));
  };
};

DEMOS.boom=function(){return '<div style="--c:#ff4d8d">'+
 '<div class="tag">prototype · drag a playhead</div>'+
 '<h2>BoomBox — synced playback over WebSockets</h2>'+
 '<p class="lede"><b>Two listeners, one session.</b> Drag either playhead and the other follows. '+
 '<b>Drop a connection</b> and watch it drift, buffer, then re-sync on reconnect — the failure '+
 'case is where the work was.</p>'+
 '<div class="demo"><div class="demo-h"><span><b>ws://session/8f21</b> · Redis pub/sub</span>'+
 '<span id="bstat">2 connected</span></div><div class="clients">'+
 '<div class="client" id="c1"><div class="cn"><span>listener A <b>host</b></span><span id="s1">live</span></div>'+
 '<div class="bar" id="b1"><i></i><b></b></div><div class="st" id="t1">00:00 / 03:20</div></div>'+
 '<div class="client" id="c2"><div class="cn"><span>listener B</span><span id="s2">live</span></div>'+
 '<div class="bar" id="b2"><i></i><b></b></div><div class="st" id="t2">00:00 / 03:20</div></div>'+
 '</div><div class="log" id="blog" style="height:120px"></div></div>'+
 '<div class="row"><button class="btn" id="bdrop" style="--c:#ff5f56">Drop listener B\'s socket</button>'+
 '<button class="btn" id="bplay" style="--c:#ff4d8d">Play / pause</button></div>'+
 '<div class="stack"><span>Next.js</span><span>TypeScript</span><span>Node WebSocket</span>'+
 '<span>Redis Pub/Sub</span><span>Supabase</span></div></div>';};
INIT.boom=function(){
  var pos=0,playing=false,bOn=true,drift=0,DUR=200;
  var log=document.getElementById('blog'),stat=document.getElementById('bstat');
  function fmt(s){var m=Math.floor(s/60),x=Math.floor(s%60);return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
  function paint(){[[1,pos],[2,bOn?pos:pos-drift]].forEach(function(p){
    var pct=Math.max(0,Math.min(100,p[1]/DUR*100)),bar=document.getElementById('b'+p[0]);
    bar.querySelector('i').style.width=pct+'%';bar.querySelector('b').style.left=pct+'%';
    document.getElementById('t'+p[0]).textContent=fmt(Math.max(0,p[1]))+' / 03:20';});}
  logline(log,'ok','session joined · 2 listeners · host = listener A');
  function seek(e){var r=e.currentTarget.getBoundingClientRect();
    pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;
    if(bOn){drift=0;logline(log,'ok','seek → '+fmt(pos)+' · broadcast · both in sync');}
    else logline(log,'warn','seek → '+fmt(pos)+' · listener B offline, event queued');
    paint();}
  document.getElementById('b1').addEventListener('click',seek);
  document.getElementById('b2').addEventListener('click',seek);
  timers.push(setInterval(function(){if(playing){pos=Math.min(DUR,pos+1);if(!bOn)drift+=1;paint();}},600));
  document.getElementById('bplay').onclick=function(){playing=!playing;
    logline(log,playing?'ok':'dim',playing?'play · state broadcast':'pause · state broadcast');};
  var drop=document.getElementById('bdrop');
  drop.onclick=function(){
    if(bOn){bOn=false;drift=0;drop.textContent='Reconnect listener B';
      document.getElementById('c2').classList.add('off');
      document.getElementById('s2').textContent='offline';stat.textContent='1 connected';
      logline(log,'err','listener B socket closed (1006, abnormal)');
      logline(log,'warn','heartbeat missed · buffering state for replay');
    }else{bOn=true;drop.textContent="Drop listener B's socket";
      document.getElementById('c2').classList.remove('off');
      document.getElementById('s2').textContent='live';stat.textContent='2 connected';
      logline(log,'warn','listener B reconnected · '+drift+'s behind');
      logline(log,'ok','replaying buffered state → re-synced to '+fmt(pos));drift=0;}
    paint();};
  paint();
};

INIT.squares=function(){
  var g=document.getElementById('qgrid'),log=document.getElementById('qlog'),stat=document.getElementById('qstat');
  for(var i=0;i<100;i++)g.appendChild(document.createElement('i'));
  var cells=g.querySelectorAll('i'),locked=false;
  logline(log,'dim','board open · 100 squares unclaimed');
  document.getElementById('qdraw').onclick=function(){
    if(locked){logline(log,'err','board is locked — draw rejected by security rule');return;}
    cells.forEach(function(c){c.className='';});stat.textContent='shuffling…';
    logline(log,'ok','running Fisher–Yates over 100 squares');
    var o=[];for(var i=0;i<100;i++)o.push(i);
    for(var i=99;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=o[i];o[i]=o[j];o[j]=tmp;}
    o.forEach(function(idx,n){timers.push(setTimeout(function(){cells[idx].className='f';
      if(n===99){stat.textContent='100 assigned';logline(log,'ok','all 100 squares assigned');}},n*10));});};
  document.getElementById('qtd').onclick=function(){
    var w=Math.floor(Math.random()*100);cells.forEach(function(c){c.classList.remove('w');});
    cells[w].classList.add('f');cells[w].classList.add('w');
    logline(log,'ok','touchdown · winner row '+Math.floor(w/10)+' col '+(w%10));};
  document.getElementById('qlock').onclick=function(){
    locked=!locked;this.textContent=locked?'Unlock the board':'Lock the board';
    stat.textContent=locked?'LOCKED':'ready';
    logline(log,locked?'warn':'ok',locked?'kickoff · board locked — writes rejected server-side'
      :'board unlocked — writes accepted');};
};

DEMOS.day=function(){return '<div style="--c:#9d8cff">'+
 '<div class="tag">craft · drag the slider</div><h2>What I can do on the front end</h2>'+
 '<p class="lede">Not a project — a demonstration. <b>Drag through 24 hours</b>: the sky is '+
 'interpolated live between eight keyframes and the agent list shows whatever is actually '+

 'style="width:100%;accent-color:#9d8cff" aria-label="time of day"></div>'+

 '<div class="stack"><span>Canvas 2D</span><span>3D projection</span><span>colour interpolation</span>'+

INIT.day=function(){
  var SKY=[[0,'#050a14','#0a1226'],[5,'#0b1428','#20223f'],[7,'#2a2340','#c07a3a'],
    [10,'#20486e','#7fb4d8'],[14,'#1c5b86','#a8d4ea'],[18,'#3a3457','#d98a4a'],
    [21,'#101a30','#1c2440'],[24,'#050a14','#0a1226']];
  var SCHED={2:['memory-index','overnight-worker'],3:['model-review'],
    6:['fleet-health','learning-agent','career','calendar','currency'],
    7:['daily-brief','scout','gig-scanner'],8:['inbox'],9:['finance','health'],11:['research'],
    12:['dashboard'],13:['wiki'],16:['weekly-review','currency-weekly'],17:['inbox'],
    18:['ceo-report','fleet-health'],20:['outcome-learner'],21:['feedback'],
    22:['harmony-backup'],23:['skill-miner']};
  function mix(a,b,k){function p(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
    var A=p(a),B=p(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*k);}).join(',')+')';}
  var sky=document.getElementById('dsky'),cl=document.getElementById('dclock'),
      ag=document.getElementById('dagents'),sl=document.getElementById('dslider');
  function paint(mins){var h=mins/60;
    for(var i=0;i<SKY.length-1;i++){if(h>=SKY[i][0]&&h<=SKY[i+1][0]){
      var k=(h-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]);
      sky.style.background='linear-gradient(170deg,'+mix(SKY[i][1],SKY[i+1][1],k)+','+mix(SKY[i][2],SKY[i+1][2],k)+')';
      break;}}
    var hh=Math.floor(h),mm=Math.floor(mins%60);
    cl.textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
    var jobs=SCHED[hh]||[];
    ag.innerHTML=jobs.length?jobs.map(function(j){return '<div class="ag fire"><i></i>'+j+'</div>';}).join('')
      :'<div class="ag" style="opacity:.45"><i style="background:#63768d;box-shadow:none"></i>nothing scheduled</div>';}
  sl.addEventListener('input',function(){paint(+sl.value);});paint(420);
};
